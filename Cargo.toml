[package]
name = "xmodits-lib"
authors = ["B0ney <https://github.com/B0ney>"]
version = "0.9.2"
edition = "2021"
description = "XMODITS core library"
repository = "https://github.com/B0ney/xmodits-lib"
license = "MPLv2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
archive = ["zip"]

[dependencies]
thiserror = "1"
bytemuck = "1"
extended = "0.1"
ascii = "1"

dasp = { version = "0.11.0", features = ["signal", "interpolate", "interpolate-linear"] }
rubato = "0.14.1"

log = { version = "0.4", optional = true }
serde = { version = "1.0", features = ["derive"] , optional = true }
zip = { version = "2.0.0", default-features = false, features = ["deflate"], optional = true}

[dev-dependencies]
env_logger = "0.10.0"
hound = "3.5.0"
